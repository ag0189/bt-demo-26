name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build sites
        run: |
          mkdir -p _site
          for s in workshops demos; do
            [ -d "$s" ] || continue
            cp -r "$s" "_site/$s"
            cd "_site/$s"
            rm -f all-files.zip
            zip -r "/tmp/$s.zip" . -x ".gitkeep" -x "index.html" > /dev/null
            mv "/tmp/$s.zip" all-files.zip
            if [ ! -f index.html ]; then
              {
                echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'"${s^}"'</title></head><body>'
                echo "<h1>${s^}</h1>"
                echo '<p><a href="all-files.zip" download>Download everything (zip)</a></p><ul>'
                for f in *.html; do
                  [ "$f" = "index.html" ] || [ ! -e "$f" ] || echo "<li><a href=\"$f\">$f</a></li>"
                done
                echo '</ul></body></html>'
              } > index.html
            fi
            cd ../..
          done
          if [ -d _site/demos ]; then
            (
              cd _site/demos
              {
                printf '['
                first=1
                for d in */; do
                  d="${d%/}"
                  [ -f "$d/index.html" ] || continue
                  [ $first -eq 1 ] || printf ','
                  first=0
                  printf '"%s"' "$d"
                done
                printf ']'
              } > folders.json
            )
          fi
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>bt-demo-26</title></head><body><h1>bt-demo-26</h1><ul>'
            echo '<li><a href="workshops/">Product workshops</a></li>'
            echo '<li><a href="demos/">Demos</a></li></ul></body></html>'
          } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
